:root{--ink:#244667;--sky:#b8ecff;--orange:#ffbc57;--pink:#ff90b3;--lav:#b59bfd}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;color:var(--ink);background:linear-gradient(160deg,#b9edff,#f9f4d9);min-height:100vh}button,select,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.47;cursor:not-allowed}.app{max-width:1720px;margin:auto;padding:12px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fffdf4eb;border:3px solid white;box-shadow:0 6px 0 #6da8b64a;border-radius:28px;padding:10px 20px;margin-bottom:12px}.heading h1{margin:0;font-size:clamp(24px,3.2vw,43px);color:#f37d31;text-shadow:2px 2px white}.heading small{font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px}.world{position:relative;aspect-ratio:1.55;overflow:hidden;border:6px solid white;border-radius:32px;box-shadow:0 10px 0 #6ca78a5e;background:linear-gradient(#77d5fc 0 38%,#b4efd8 39%,#a1d976 85%)}.cloud{position:absolute;top:4%;left:20%;color:white;font-size:75px;filter:drop-shadow(0 5px 0 #ffffff88)}.school{position:absolute;top:12%;left:24%;width:52%;height:39%;background:linear-gradient(#ffebba,#fff8e0);border:5px solid #d98b58;border-radius:8px 8px 19px 19px;box-shadow:0 13px 0 #caa982}.school:before{content:"";position:absolute;left:-4%;top:-16%;width:108%;height:19%;background:#df786b;clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}.school .windows{display:grid;grid-template-columns:repeat(7,1fr);gap:3%;padding:6% 5%}.school .windows span{height:45px;background:#87dafa;border:4px solid #fff;border-radius:5px;box-shadow:inset 0 3px 0 #6cadd5}.school strong{position:absolute;left:35%;top:55%;width:30%;text-align:center;background:#ffe1a0;border:2px solid #bd8260;border-radius:12px;padding:5px;font-size:clamp(9px,1.5vw,19px)}.flag{position:absolute;top:4%;right:16%;font-size:48px;z-index:3}.tree{position:absolute;font-size:clamp(36px,6vw,90px);filter:drop-shadow(3px 7px 0 #588d43a9)}.tree.a{left:8%;top:24%}.tree.b{right:5%;top:31%}.tree.c{left:10%;bottom:20%}.track{position:absolute;left:27%;top:53%;width:47%;height:29%;background:#e88b70;border:10px double #fff0db;border-radius:50%;box-shadow:0 0 0 6px #d97b5b,0 7px 0 #669c51}.track:after{content:"🏃‍♀️　🏃　🏃‍♂️";position:absolute;inset:0;border-radius:50%;background:#91d772;border:5px solid #fff;display:grid;place-items:center;font-size:clamp(15px,3.2vw,45px);white-space:nowrap}.gate{position:absolute;bottom:2%;left:37%;font-size:clamp(12px,2.2vw,26px);font-weight:900;background:#fff0c5;border:5px solid #bd8a68;border-radius:50% 50% 10px 10px;padding:12px;z-index:2}.tiles{position:absolute;inset:0;z-index:5}.tile{position:absolute;width:12%;height:13%;display:grid;place-items:center;align-content:center;text-align:center;border:3px solid white;border-radius:17px;background:linear-gradient(#fff7ca,#ffbe68);box-shadow:0 5px 0 #ce9d54,0 8px 12px #43694c61;font-weight:900;font-size:clamp(10px,1.65vw,20px);line-height:1.12;transform:translate(-50%,-50%);padding:3px}.tile small{font-size:.58em;position:absolute;top:3px;left:6px;background:#fff;color:#a55d31;padding:2px 5px;border-radius:10px}.tile.chance{background:linear-gradient(#ffe5f1,#ff89b1);box-shadow:0 5px 0 #bc618e,0 8px 12px #43694c61}.tile.fate{background:linear-gradient(#ece3ff,#b99bff);box-shadow:0 5px 0 #8a6ac5,0 8px 12px #43694c61}.tile .pieces{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);display:flex;white-space:nowrap;gap:0;z-index:6;font-size:clamp(13px,1.9vw,25px);text-shadow:0 2px white}.side{display:flex;flex-direction:column;gap:12px}.panel{background:#fffcf1;border:4px solid white;border-radius:25px;box-shadow:0 6px 0 #97b7a65c;padding:14px}.panel h2{font-size:20px;margin:0 0 9px;color:#8551af}.field{display:block;margin:7px 0;font-weight:800;font-size:13px}.field select{display:block;width:100%;margin-top:4px;border:2px solid #c2dbe7;background:#fff;border-radius:10px;padding:8px}.selection{max-height:150px;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.selection label{font-size:12px;background:#f4f9ff;border-radius:9px;padding:7px}.players{max-height:210px;overflow:auto}.players .line{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#ecf8ff;border-radius:12px;margin-bottom:6px;padding:7px;font-size:13px}.players .line.active{background:#fff0bc;border:2px solid #efb956}.players img{width:28px;height:28px;border-radius:50%;vertical-align:middle;object-fit:cover}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#ef8d58;color:white;border:0;border-radius:12px;font-weight:900;padding:10px 16px;box-shadow:0 4px 0 #bb6538}.btn.blue{background:#469ed4;box-shadow:0 4px 0 #2874a3}.btn.green{background:#50b289;box-shadow:0 4px 0 #2e8b64}.btn.gray{background:#9b9baf;box-shadow:0 4px 0 #70728d}.status{padding:8px;background:#eefaf5;border-radius:12px;font-size:13px;font-weight:800;line-height:1.6}.modal{position:fixed;inset:0;z-index:30;background:#18375699;display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.dialog{width:min(650px,95vw);max-height:92vh;overflow:auto;background:#fffdf2;border:7px solid white;border-radius:28px;padding:23px;box-shadow:0 15px 45px #153d6880}.dialog h2{font-size:27px;color:#df7d45;margin:0 0 16px}.options{display:grid;gap:9px}.options button{width:100%;text-align:left;background:#eff9ff;border:2px solid #a7d2eb;border-radius:15px;padding:12px;font-size:18px;font-weight:800}.options button.correct{background:#b3edc7}.options button.wrong{background:#ffd4d2}.notice{font-size:14px;line-height:1.6;color:#54708b}.rank{margin:8px 0;padding:8px;background:#fff4d6;border-radius:10px}.rank strong{float:right}@media(max-width:980px){.layout{grid-template-columns:1fr}.world{aspect-ratio:1.38}.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.tile{font-size:clamp(10px,2vw,19px)}}@media(max-width:550px){.side{display:flex}.world{aspect-ratio:1.05}.tile{border-radius:8px;border-width:2px;font-size:9px}.tile small{font-size:8px}.heading small{display:none}}
</style></head><body><div class="app"><header class="heading"><h1>🎒 校園闖關大富翁</h1><small>☀️ 青天白日・快樂學自然 🌈</small><button class="btn gray" onclick="document.documentElement.requestFullscreen?.()">⛶ 全螢幕</button></header><div class="layout"><main class="world"><div class="cloud">☁️</div><div class="school"><div class="windows" id="windows"></div><strong>教學大樓</strong></div><div class="flag">🇹🇼</div><div class="tree a">🌳</div><div class="tree b">🌳</div><div class="tree c">🌲</div><div class="track"></div><div class="gate">🏫 大成國小</div><div class="tiles" id="tiles"></div></main><aside class="side"><section class="panel"><h2>📚 題庫選擇</h2><div class="controls"><button class="btn blue" id="allUnits">全部選取</button><button class="btn gray" id="clearUnits">清除</button></div><div class="selection" id="bankOptions"></div><div class="notice" id="bankStatus">載入自然題庫中…</div></section><section class="panel"><h2>👫 玩家選擇（2～6人）</h2><label class="field">班級<select id="classSelect"></select></label><label class="field">學生<select id="studentSelect"></select></label><div class="controls"><button class="btn blue" id="addPlayer">＋ 加入玩家</button><button class="btn gray" id="removePlayer">移除最後一位</button></div><div class="notice" id="rosterStatus">等待 FunDesk 授權傳送班級名單…</div><div class="players" id="selectionPlayers"></div></section><section class="panel"><h2>🎲 遊戲控制</h2><div class="controls"><button class="btn green" id="startGame">開始遊戲</button><button class="btn" id="rollDice" disabled>擲骰子</button><button class="btn gray" id="resetGame">重新開始</button></div><p class="status" id="status">請選擇題庫與 2～6 位玩家</p></section><section class="panel"><h2>🏆 排名與積點</h2><div id="ranking"></div><div class="notice">完成一圈後依抵達終點順序頒獎：第一名 +5 點；3～6 人參賽時第二名 +3 點；2 人參賽只有第一名獲得積點。老師確認後才會寫入 FunDesk。</div></section></aside></div></div><div class="modal" id="modal" hidden><div class="dialog" id="dialog"></div></div><script src="campus-bank.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c])),pick=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>[...a].sort(()=>Math.random()-.5);
const TYPES=Array.from({length:20},(_,i)=>[2,7,12,19].includes(i)?'chance':[4,9,14,17].includes(i)?'fate':'question');
const POS=[[15,17],[27,17],[39,17],[51,17],[63,17],[75,17],[87,17],[89,31],[89,45],[89,59],[89,73],[77,88],[65,88],[53,88],[41,88],[29,88],[17,88],[11,73],[11,59],[11,45]];
const FACES=['🐯','🐰','🐼','🦊','🐸','🦁'];
let classes=[],players=[],active=0,turn=0,phase='setup',finish=[],questionBank=[],used=new Set(),selected=[],pending=null,teacherToken=new URLSearchParams(location.search).get('fundeskToken')||'',rewardSent=false,gameId='',draw=[];
const unitOf=q=>{let u=String(q.unit||q.unit_code||q.unit_no||q.unit_id||'');let a=String(q.activity||q.activity_code||'');let m=u.match(/0?([1-4])(?:[-_ ]0?([1-3]))?/);if(m){u=m[1];if(m[2])a=m[2]}else{const s=JSON.stringify(q);m=s.match(/(?:unit|單元)\s*0?([1-4])[-_ ]?(?:活動)?0?([1-3])?/i);if(m){u=m[1];if(m[2])a=m[2]}}const ma=a.match(/[1-3]/);return {unit:u.match(/[1-4]/)?.[0]||'',activity:ma?.[0]||''}};
function normalize(q,i){const text=q.question||q.q||q.question_text||q.content||q.title;let opts=q.options||q.choices||[];if(typeof opts==='string'){try{opts=JSON.parse(opts)}catch{opts=opts.split(/[|；\n]/)}}if(opts&&!Array.isArray(opts)&&typeof opts==='object')opts=Object.values(opts);if(!Array.isArray(opts)||opts.length<2)opts=['正確（○）','錯誤（╳）'];let ans=q.answer??q.correct_answer??q.answer_index??q.correct_index;if(typeof ans==='string'){const t=ans.trim();if(/^[A-D]$/i.test(t))ans=t.toUpperCase().charCodeAt(0)-65;else if(/^[1-4]$/.test(t))ans=Number(t)-1;else if(t==='正確'||t==='○')ans=0;else if(t==='錯誤'||t==='╳')ans=1;else if(!isNaN(Number(t)))ans=Number(t);else ans=opts.indexOf(t)}ans=Number(ans);if(ans>=opts.length&&ans-1<opts.length)ans--;const {unit,activity}=unitOf(q);if(!text||!Number.isInteger(ans)||ans<0||ans>=opts.length||!unit)return null;return {id:String(q.id||i),unit,activity,text:String(text),options:opts.map(String),answer:ans,explanation:String(q.explanation||q.explain||q.analysis||'請參考課本或與老師討論。')} }
function bankUI(){const box=$('bankOptions');box.innerHTML=Array.from({length:12},(_,i)=>{let u=Math.floor(i/3)+1,a=i%3+1,k=u+'-'+a;return '<label><input type="checkbox" value="'+k+'" checked> 第'+u+'單元・活動'+a+'</label>'}).join('');box.addEventListener('change',bankCount);bankCount()}
function bankCount(){selected=[...document.querySelectorAll('#bankOptions input:checked')].map(x=>x.value);const matches=questionBank.filter(q=>selected.includes(q.unit+'-'+q.activity)).length;$('bankStatus').textContent='已選 '+selected.length+' 個活動，可用 '+matches+' 題'+(selected.length&&!matches?'；此活動尚無可用題目，不能開始':'');}
function tiles(){const codes=classes.map(x=>x.code).filter(Boolean);draw=TYPES.map((type,i)=>({type,label:type==='chance'?'⭐ 機會':type==='fate'?'🎴 命運':(codes.length?pick(codes):'501')}));$('tiles').innerHTML=draw.map((t,i)=>'<div class="tile '+(t.type==='chance'?'chance':t.type==='fate'?'fate':'')+'" style="left:'+POS[i][0]+'%;top:'+POS[i][1]+'%"><small>'+(i+1)+'</small>'+escape(t.label)+'<div class="pieces" id="spot'+i+'"></div></div>').join('');updatePieces()}
function updatePieces(){for(let i=0;i<20;i++){const el=$('spot'+i);if(el)el.textContent=players.filter(p=>!p.finished&&p.pos%20===i&&p.steps>0).map(p=>p.icon).join('')} }
function rosterUI(){const s=$('classSelect'),current=s.value;s.innerHTML=classes.map(c=>'<option value="'+escape(c.code)+'">'+escape(c.label||c.code)+'</option>').join('');if(classes.some(c=>c.code===current))s.value=current;studentsUI();tiles();$('rosterStatus').textContent=classes.length?'已從 FunDesk 取得 '+classes.length+' 個班級，請挑選學生':'尚未取得 FunDesk 名單。請從 FunDesk 首頁點選「校園大富翁」進入。'}
function studentsUI(){const c=classes.find(x=>x.code===$('classSelect').value),s=$('studentSelect');s.innerHTML=(c?.students||[]).map(p=>'<option value="'+escape(p.id)+'">'+escape(p.no+'號 '+p.name)+'</option>').join('')}
function playersUI(){$('selectionPlayers').innerHTML=players.map((p,i)=>'<div class="line '+(i===active&&phase==='playing'?'active':'')+'"><span>'+(p.avatar?'<img src="'+escape(p.avatar)+'" onerror="this.style.display=\'none\'">':p.icon)+' '+escape(p.code)+' '+escape(p.no+'號 '+p.name)+'</span><b>'+p.score+'分 '+(p.finished?'🏁':p.steps+'步')+'</b></div>').join('');$('ranking').innerHTML=[...players].sort((a,b)=>a.finished&&b.finished?(a.place-b.place):a.finished?-1:b.finished?1:b.score-a.score||b.steps-a.steps).map((p,i)=>'<div class="rank">'+(i+1)+'. '+p.icon+' '+escape(p.name)+' <strong>'+(p.finished?'第'+p.place+'名':p.score+'分')+'</strong></div>').join('')}
function notice(t){$('status').textContent=t;playersUI();updatePieces()}
function show(content){$('dialog').innerHTML=content;$('modal').hidden=false}
function close(){$('modal').hidden=true}
function next(){close();if(finish.length===players.length){endGame();return}active=(active+1)%players.length;while(players[active].finished)active=(active+1)%players.length;turn++;phase='playing';$('rollDice').disabled=false;notice('輪到 '+players[active].name+'，請擲骰子')}
function resolve(){const p=players[active];if(p.steps>=20){p.finished=true;p.place=finish.length+1;finish.push(p.id);notice(p.name+' 已抵達終點！目前第 '+p.place+' 名');show('<h2>🏁 抵達終點！</h2><p>'+escape(p.name)+' 完成一圈，獲得第 '+p.place+' 名！</p><button class="btn green" id="continue">繼續遊戲</button>');$('continue').onclick=next;return}
const t=draw[p.pos];if(t.type==='question')question(p,t);else card(p,t.type)}
function question(p,t){const pool=questionBank.filter(q=>selected.includes(q.unit+'-'+q.activity));if(!pool.length){show('<h2>題庫暫無題目</h2><button class="btn" id="cont">繼續</button>');$('cont').onclick=next;return}let available=pool.filter(q=>!used.has(q.id));if(!available.length){used.clear();available=pool}const q=pick(available);used.add(q.id);show('<h2>📘 '+escape(t.label)+' 班自然挑戰</h2><p class="notice">由 '+escape(p.name)+' 作答・第 '+q.unit+' 單元 活動 '+(q.activity||'未分類')+'</p><h3>'+escape(q.text)+'</h3><div class="options" id="answers">'+q.options.map((o,i)=>'<button data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+escape(o)+'</button>').join('')+'</div><div id="feedback"></div>');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(pending)return;pending=true;const n=Number(b.dataset.answer),correct=n===q.answer;p.score+=correct?10:0;document.querySelectorAll('[data-answer]').forEach(el=>{el.disabled=true;const k=Number(el.dataset.answer);if(k===q.answer)el.classList.add('correct');if(k===n&&!correct)el.classList.add('wrong')});$('feedback').innerHTML='<p class="status">'+(correct?'🎉 答對！獲得 10 遊戲分':'再接再厲！本題不加分')+'</p><p>正確答案：'+escape(q.options[q.answer])+'</p><p class="notice">詳解：'+escape(q.explanation)+'</p><button class="btn green" id="continue">下一位玩家</button>';$('continue').onclick=()=>{pending=false;next()};playersUI()})}
const CARDS={chance:[['⭐ 進步獎勵','遊戲分數 +10',10,0],['🌈 熱心助人','遊戲分數 +5',5,0],['🚀 快速前進','額外前進 2 步',0,2],['🍀 幸運日','遊戲分數 +15',15,0]],fate:[['🌧️ 忘記帶課本','遊戲分數 -5',-5,0],['🐢 慢慢走','遊戲分數 -3',-3,0],['💫 迷路了','退回 2 步',0,-2],['🌱 整理校園','遊戲分數 +5',5,0]]};
function card(p,type){const c=pick(CARDS[type]);p.score=Math.max(0,p.score+c[2]);if(c[3]){p.steps=Math.max(0,p.steps+c[3]);p.pos=Math.max(0,p.steps-1)%20}show('<h2>'+(type==='chance'?'⭐ 機會卡':'🎴 命運卡')+'</h2><h3>'+c[0]+'</h3><p style="font-size:23px">'+c[1]+'</p><button class="btn green" id="continue">下一位玩家</button>');$('continue').onclick=next;playersUI();updatePieces()}
function start(){bankCount();if(!teacherToken||!classes.length){alert('必須由登入的 FunDesk 教師端開啟，才能使用正式學生及頒獎。');return}if(players.length<2||players.length>6){alert('請選擇 2～6 位玩家');return}if(!selected.length||!questionBank.some(q=>selected.includes(q.unit+'-'+q.activity))){alert('目前所選活動沒有題目');return}players.forEach(p=>{p.pos=0;p.steps=0;p.score=0;p.finished=false;p.place=0});finish=[];used.clear();active=0;turn=0;phase='playing';rewardSent=false;gameId=crypto.randomUUID?.()||String(Date.now())+'-'+Math.random();tiles();$('rollDice').disabled=false;notice('遊戲開始！由 '+players[0].name+' 先擲骰子')}
function endGame(){phase='ended';$('rollDice').disabled=true;const winners=finish.slice(0,players.length===2?1:2).map((id,i)=>{const p=players.find(x=>x.id===id);return {id:p.id,code:p.code,no:p.no,name:p.name,rank:i+1,delta:i===0?5:3}});show('<h2>🏆 闖關完成！</h2><p>所有玩家都已走完 20 格。</p>'+winners.map(w=>'<div class="rank">'+w.rank+' 名 '+escape(w.name)+' <strong>+'+w.delta+' FunDesk 點</strong></div>').join('')+'<p class="notice">送交 FunDesk 後，教師端須再次確認才能真正加點。</p><button class="btn green" id="award">送交老師確認頒獎</button> <button class="btn gray" id="close">先不頒獎</button>');$('award').onclick=()=>{if(rewardSent)return;rewardSent=true;window.opener?.postMessage({kind:'fundesk-monopoly-award',token:teacherToken,gameId,players:players.map(p=>({id:p.id,code:p.code,place:p.place})),winners},location.origin);$('award').disabled=true;$('award').textContent='已送出，等待教師確認';notice('闖關結束，獎勵已送交 FunDesk 教師端確認')};$('close').onclick=close}
function loadInitial(){questionBank=(window.CAMPUS_QUESTIONS||[]).map(normalize).filter(Boolean);bankCount();loadThirdUnit();if(teacherToken&&window.opener){window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.opener||e.data?.token!==teacherToken)return;if(e.data.kind==='fundesk-monopoly-roster'){classes=(e.data.classes||[]).filter(x=>Array.isArray(x.students)).map(x=>({code:String(x.code),label:String(x.label),students:x.students.map(s=>({id:String(s.id),name:String(s.name),no:s.no,avatar:String(s.avatar||'')}))}));rosterUI()}else if(e.data.kind==='fundesk-monopoly-award-result'){alert(e.data.ok?'老師已確認寫入 FunDesk 積點':'FunDesk 尚未確認積點：'+(e.data.error||'請聯絡老師'))}});window.opener.postMessage({kind:'fundesk-monopoly-ready',token:teacherToken},location.origin)}else{$('rosterStatus').textContent='請從 FunDesk 開啟遊戲以載入正式學生名單；此頁不會公開學生資料。'}}
async function loadThirdUnit(){const base='https://ayvwsexnxvjjcrbtyoof.supabase.co/rest/v1/quiz_questions?select=*&limit=1000',key='sb_publishable_Z2rS84mJC4BK-h4oLsNNjw_CdQz240L';try{const r=await fetch(base,{headers:{apikey:key}});if(r.ok){const rows=await r.json();const seen=new Set(questionBank.map(q=>q.id));rows.map(normalize).filter(Boolean).forEach(q=>{if(!seen.has(q.id)){questionBank.push(q);seen.add(q.id)}});bankCount()}}catch(e){console.warn('雲端題庫未載入',e)}}
$('windows').innerHTML='<span></span>'.repeat(14);bankUI();tiles();rosterUI();playersUI();$('classSelect').onchange=studentsUI;$('allUnits').onclick=()=>{document.querySelectorAll('#bankOptions input').forEach(x=>x.checked=true);bankCount()};$('clearUnits').onclick=()=>{document.querySelectorAll('#bankOptions input').forEach(x=>x.checked=false);bankCount()};
$('addPlayer').onclick=()=>{if(phase!=='setup')return;if(players.length>=6)return alert('最多 6 位玩家');const c=classes.find(x=>x.code===$('classSelect').value),s=c?.students.find(x=>x.id===$('studentSelect').value);if(!s)return;if(players.some(p=>p.id===s.id&&p.code===c.code))return alert('同一學生只能參賽一次');players.push({...s,code:c.code,icon:FACES[players.length],score:0,steps:0,pos:0,finished:false});playersUI()};
$('removePlayer').onclick=()=>{if(phase==='setup'){players.pop();playersUI()}};$('startGame').onclick=start;$('rollDice').onclick=()=>{if(phase!=='playing'||pending)return;const p=players[active];$('rollDice').disabled=true;const n=1+Math.floor(Math.random()*6);p.steps+=n;p.pos=Math.max(0,p.steps-1)%20;notice(p.name+' 擲出 '+n+' 點，前進到 '+(p.steps>=20?'終點':'第'+(p.pos+1)+'格'));setTimeout(resolve,650)};$('resetGame').onclick=()=>{if(phase==='playing'&&!confirm('重新開始會清除本局進度，確定嗎？'))return;phase='setup';players=[];finish=[];rewardSent=false;close();tiles();playersUI();$('rollDice').disabled=true;notice('請重新選擇 2～6 位玩家')};loadInitial();
})();
</script></body></html>
