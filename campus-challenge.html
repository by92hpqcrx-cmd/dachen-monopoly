function reset(){document.body.classList.remove('campus-answer-focus');if(phase==='playing'&&!confirm('確定放棄本局，重新設定玩家？'))return;busy=false;close();phase='setup';players=[];placed=[];rewardSent=false;active=0;$('face').textContent='—';$('roll').disabled=true;updateTokens();setStatus('請選科目、單元、活動及 2～6 位玩家');setBlackboardIdle();setDeckText('機會','點此查看機會卡說明');setDeckText('命運','點此查看命運卡說明')}
function loadRoster(){if(!token||!window.opener)return;window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.opener||e.data?.token!==token)return;if(e.data.kind==='fundesk-monopoly-roster'){classes=(e.data.classes||[]).filter(c=>Array.isArray(c.students)).map(c=>({code:String(c.code),label:String(c.label),students:c.students.map(s=>({id:String(s.id),name:String(s.name),no:Number(s.no),avatar:String(s.avatar||'')}))}));setStatus('已連接 FunDesk '+classes.length+' 班，請選擇玩家')}else if(e.data.kind==='fundesk-monopoly-award-result'){alert(e.data.ok?'老師已確認將得獎點數寫入 FunDesk！':'尚未完成頒獎：'+(e.data.error||'教師未確認'));if(!e.data.ok)rewardSent=false}});window.opener.postMessage({kind:'fundesk-monopoly-ready',token},location.origin)}
// 使用既有 Supabase 公開讀取權限；沒有任何私密 service_role key。
async function cloudBank(){
 const url='https://ayvwsexnxvjjcrbtyoof.supabase.co',key='sb_publishable_Z2rS84mJC4BK-h4oLsNNjw_CdQz240L';
 let added=0,unclassified=0,invalid=0;const reports=[];
 const seen=new Set(bank.filter(q=>q.subject==='science').map(q=>q.unit+'|'+q.text.trim()));
 for(const table of ['quiz_questions','nature_questions']){
  let total=0,accepted=0;
  try{
   for(let offset=0;offset<5000;offset+=500){
    const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
    let res;try{res=await fetch(url+'/rest/v1/'+table+'?select=*&limit=500&offset='+offset,{headers:{apikey:key,Accept:'application/json'},signal:controller.signal,cache:'no-store'})}finally{clearTimeout(timeout)}
    if(!res.ok){reports.push(table+': HTTP '+res.status);break}
    const rows=await res.json();if(!Array.isArray(rows)){reports.push(table+': 格式不正確');break}total+=rows.length;
    for(let i=0;i<rows.length;i++){
     const q=normalize(rows[i],table+'-'+offset+'-'+i);if(!q){invalid++;continue}
     if(!q.activity){unclassified++;continue} // 未標記活動的題目不可擅自歸類為活動 1～3。
     const identity=q.unit+'|'+q.text.trim();if(seen.has(identity))continue;
     q.id=table+':'+q.id;seen.add(identity);bank.push(q);added++;accepted++;
    }
    if(rows.length<500)break;
   }
   reports.push(table+': 讀取 '+total+' 筆／新增 '+accepted+' 題');
  }catch(e){reports.push(table+': '+(e?.name==='AbortError'?'連線逾時':e?.message||'連線失敗'))}
 }
 const counts=Array.from({length:4},(_,i)=>{const u=String(i+1);return '第'+u+'單元 '+bank.filter(q=>q.subject==='science'&&q.unit===u&&q.activity).length+'題'});
 cloudReport='已載入：'+counts.join('、')+'。線上新增 '+added+' 題。'+reports.join('；')+(unclassified?'；有 '+unclassified+' 題缺活動標記，暫不列入12活動':'')+(invalid?'；有 '+invalid+' 筆資料缺題幹、選項或答案':'');
 const info=$('cloudStatus');if(info)info.textContent=cloudReport;
 if($('bankSubject')?.value==='science'){
  document.querySelectorAll('#bankChips .activity-toggle').forEach(input=>{const span=input.closest('label')?.querySelector('.activity-count');if(span)span.textContent=bank.filter(q=>q.subject==='science'&&keyOf(q)===input.value).length+' 題'});
  const info=$('cloudStatus');if(info)info.textContent=cloudReport;
 }

}
const raw=window.CAMPUS_QUESTIONS||[];
bank=raw.map(normalize).filter(Boolean);
for(const q of (Array.isArray(window.SOCIAL_QUESTIONS)?window.SOCIAL_QUESTIONS:[])){
 if(!q.question||!q.unit||!q.activity||typeof q.correct!=='boolean')continue;
 bank.push({subject:'social',id:'social:'+q.id,unit:String(q.unit),activity:String(q.activity),text:String(q.question),options:['○ 正確','× 錯誤'],answer:q.correct?0:1,explanation:String(q.explanation||'原題庫未提供詳解。')});
}
for(const q of (Array.isArray(window.FUNDESK_MATH_QUESTIONS)?window.FUNDESK_MATH_QUESTIONS:[])){
 const m=String(q.unit||'').match(/^10-0?([1-4])$/);
 if(!m||!q.question||!Array.isArray(q.options)||q.options.length!==4||
 !Number.isInteger(q.answer)||q.answer<0||q.answer>=4)continue;
 bank.push({subject:'math',id:String(q.id),unit:'10',activity:m[1],
  text:String(q.question),options:q.options.map(String),answer:q.answer,
  explanation:String(q.explanation||''),sourceId:String(q.sourceId||'')});
}

for(const q of (Array.isArray(window.FUNDESK_MATH9_QUESTIONS)?window.FUNDESK_MATH9_QUESTIONS:[])){
 const m=String(q.unit||'').match(/^9-0?([1-5])$/);
 if(!m||!q.question||!Array.isArray(q.options)||q.options.length!==4||!Number.isInteger(q.answer)||q.answer<0||q.answer>3)continue;
 bank.push({subject:'math',id:String(q.id),unit:'9',activity:m[1],text:String(q.question),
  options:q.options.map(String),answer:q.answer,explanation:String(q.explanation||''),sourceId:String(q.sourceId||'')});
}
renderUpdatedTileLabels();
picked=Array.from({length:12},(_,i)=>String(1+Math.floor(i/3))+'-'+String(1+i%3));cloudReport='第一、二、四單元內建題庫已載入；正在檢查雲端第三、四單元…';setBlackboardIdle();syncBankSummary();cloudBank();loadRoster();renderBoardPlayers();
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>({bank:presentBank,players:presentPlayers,stats:presentStats}[b.dataset.panel])());$('chanceDeckBtn').onclick=()=>showDeckIntro('機會');$('fateDeckBtn').onclick=()=>showDeckIntro('命運');$('setup').onclick=()=>phase==='setup'?presentPlayers():presentStats();$('begin').onclick=start;$('howto').onclick=presentRules;
const fontControl=$('fontStyle');document.body.classList.add('font-cute');fontControl.value='cute';fontControl.onchange=()=>{document.body.classList.toggle('font-cute',fontControl.value==='cute');document.body.classList.toggle('font-standard',fontControl.value==='standard');};
const fullscreen=$('fullscreen');fullscreen.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else{window.scrollTo(0,0);await document.querySelector('.app').requestFullscreen()}}catch(err){alert('全螢幕無法啟用：'+(err?.message||'瀏覽器限制'))}};
document.addEventListener('fullscreenchange',()=>{fullscreen.textContent=document.fullscreenElement?'⤢ 離開全螢幕':'⛶ 全螢幕'});$('roll').onclick=()=>{if(phase!=='playing'||busy)return;const p=players[active];$('roll').disabled=true;$('roll').classList.add('is-rolling');setTimeout(()=>$('roll')?.classList.remove('is-rolling'),850);const n=1+Math.floor(Math.random()*6);$('face').textContent=n;p.steps+=n;setStatus(p.name+' 擲出 '+n+' 點，前往 '+(p.steps>=20?'終點':'第'+p.steps+'格'));updateTokens();banner('🎲 '+n+' 點');setTimeout(landed,750)};$('score').onclick=presentStats;$('reset').onclick=reset;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
