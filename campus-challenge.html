const field=(r,...keys)=>{for(const k of keys){const v=r?.[k];if(v!==undefined&&v!==null&&v!=='')return v}return null};
function unitActivity(q){
 const vals=[field(q,'unit','unit_name','unit_title','unit_id','chapter','chapter_name','category','subject'),field(q,'source','source_name'),field(q,'activity','activity_code','activity_no','activity_id','subunit','sub_unit','section','section_code','lesson_code','topic')].filter(v=>v!=null).map(String);
 const t=vals.join(' | ').replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65296));let unit='',act='';
 for(const part of vals){const m=part.match(/(?:^|[^0-9])0?([1-4])\s*[-_.／/]\s*0?([1-3])(?:[^0-9]|$)/);if(m){unit=m[1];act=m[2];break}}
 if(!unit){const m=t.match(/第?\s*([一二三四1-4])\s*(?:單元|章)/)||t.match(/(?:^|[^0-9])0?([1-4])(?:[^0-9]|$)/)||t.match(/(?:unit|chapter|u)\s*[-:_ ]*0?([1-4])/i);if(m){const lut={一:'1',二:'2',三:'3',四:'4'};unit=lut[m[1]]||m[1]}}

 if(!act){const m=t.match(/(?:活動|activity|section)\s*[:：_#-]*\s*0?([一二三1-3])/)||String(field(q,'activity','activity_code','activity_no','activity_id','subunit','section')??'').match(/^0?([1-3])$/);if(m){const lut={一:'1',二:'2',三:'3'};act=lut[m[1]]||m[1]}}
 return [unit,act];
}
function options(q){let a=field(q,'options','choices','answers','option_list');if(typeof a==='string'){try{a=JSON.parse(a)}catch{a=a.includes('|')?a.split('|'):a.split(/[；\n]/)}}if(Array.isArray(a))return a.map(v=>typeof v==='object'&&v!==null?String(field(v,'text','label','value','option')??''):String(v)).filter(Boolean);if(a&&typeof a==='object')return Object.values(a).map(String);return ['a','b','c','d'].map(l=>field(q,'option_'+l,l,'choice_'+l)).filter(x=>x!=null).map(String)}
function normalize(q,i){
 const txt=field(q,'question','question_text','question_content','question_title','prompt','question_body','question_stem','questionText','questionContent','questionTitle','title','content','stem','text','body','q','題目','題幹');
 const opt=options(q);let ans=field(q,'answer','correct_answer','correct_option','correct','answer_index','correct_index','correctOptionId','correctAnswer');
 if(Array.isArray(ans)&&ans.length===1)ans=ans[0];
 if(typeof ans==='string'&&ans.trim().startsWith('[')){try{const arr=JSON.parse(ans);if(Array.isArray(arr)&&arr.length===1)ans=arr[0]}catch{}}
 let index=-1;const raw=String(ans??'').trim();
 if(/^[A-D]$/i.test(raw))index=raw.toUpperCase().charCodeAt(0)-65;
 else if(raw==='正確'||raw==='○')index=0;else if(raw==='錯誤'||raw==='╳')index=1;

 else index=opt.findIndex(o=>o.trim()===raw);

 if(!txt||opt.length<2||index<0||index>=opt.length||!unit)return null;
 return {subject:'science',id:String(field(q,'id','question_id','qid')??i),text:String(txt),options:opt,answer:index,unit,activity,explanation:String(field(q,'explanation','explain','analysis','solution','reason','answer_explanation','description')??'原題庫未提供詳解。')};
}

function ask(p,cl){document.body.classList.add('campus-answer-focus');const pool=selectedQuestions();let filtered=pool.filter(q=>!used.has(q.id));if(!filtered.length){used.clear();filtered=pool}if(!filtered.length){setBlackboard('題庫暫無可用題目','<h3>目前沒有可用題目</h3><p>請重新選擇活動後再開始遊戲。</p>',[bbAction('下一位玩家',next,'green')],'題目區');return}const q=rand(filtered);used.add(q.id);busy=false;setBlackboard((subject==='social'?'🌏 ':subject==='math'?'🔢 ':'📗 ')+classDisplay(p)+(subject==='social'?'社會挑戰':subject==='math'?'數學挑戰':'自然挑戰'),'<h3>'+html(q.text)+'</h3><p class="bb-note">作答者：'+html(p.name)+'｜棋盤關卡：'+html(String(cl))+'｜第 '+q.unit+' 單元・活動 '+(q.activity||'未分類')+'</p><div class="bb-answers" id="bbAnswers">'+q.options.map((o,i)=>'<button class="bb-answer" data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+html(o)+'</button>').join('')+'</div><div id="bbFeedback"></div>',[], '題目區');document.querySelectorAll('#bbAnswers [data-answer]').forEach(b=>b.onclick=()=>{if(busy)return;busy=true;const i=Number(b.dataset.answer),ok=i===q.answer;p.score+=ok?10:0;document.querySelectorAll('#bbAnswers [data-answer]').forEach(x=>{x.disabled=true;if(Number(x.dataset.answer)===q.answer)x.classList.add('good');else if(Number(x.dataset.answer)===i)x.classList.add('bad')});$('bbFeedback').innerHTML='<div class="feedback"><strong>'+(ok?'🎉 答對了！+10 遊戲分':'💪 再接再厲！')+'</strong><p>正確答案：'+html(q.options[q.answer])+'</p><p>詳解：'+html(q.explanation)+'</p></div>';const act=$('bbActions');act.innerHTML='';act.append(bbAction('下一位玩家',()=>{busy=false;next()},'green'));setStatus(p.name+(ok?' 答對 +10 遊戲分':' 答錯，沒有加分'))})}
function start(){if(phase!=='setup')return;if(players.length<2||players.length>6)return alert('請先選擇 2～6 名 FunDesk 學生');if(!classes.length||!token)return alert('請從 FunDesk 教師工作台開啟，才能使用班級學生資料');if(!picked.length||!bankCount())return alert('題庫尚未選好或所選活動沒有題目');gameId=uuid();used.clear();placed=[];rewardSent=false;phase='playing';active=0;players.forEach(p=>{p.steps=0;p.score=0;p.rank=0});$('roll').disabled=false;setStatus('準備好了！由 '+players[0].name+' 開始');setBlackboard('黑板作答區','<h3>闖關開始！</h3><p>目前輪到 <span class="bb-highlight">'+html(players[0].name)+'</span>，請按下骰子開始前進。</p><p class="bb-note">停在班級格會在這裡答題；停在機會或命運格會在這裡顯示抽卡結果。</p>',[], '進行中');banner('闖關開始！');updateTokens()}
function end(){phase='ended';$('roll').disabled=true;const win=placed.slice(0,players.length===2?1:2).map((id,i)=>{const p=players.find(q=>q.id===id);return {id:p.id,code:p.code,name:p.name,no:p.no,rank:i+1,delta:i?3:5}});popup('<h2>🏆 校園闖關完成！</h2><p>大家都完成一圈了，恭喜！</p>'+win.map(w=>'<div class="item">🥇 第'+w.rank+'名 '+html(classDisplay(players.find(p=>p.code===w.code&&p.id===w.id)||w)+' '+w.name)+'<strong>FunDesk +'+w.delta+' 點</strong></div>').join('')+'<p class="subtle">送交老師端後，需要由老師再次確認；未確認前不會加點。</p>');footer([normalAction('送交教師確認頒獎',()=>{if(rewardSent)return;rewardSent=true;window.opener?.postMessage({kind:'fundesk-monopoly-award',token,gameId,players:players.map(p=>({id:p.id,code:p.code,place:p.rank})),winners:win},location.origin);setStatus('已送交 FunDesk，等待教師確認');close()},'green'),normalAction('暫不頒獎',close,'purple')])}
function reset(){document.body.classList.remove('campus-answer-focus');if(phase==='playing'&&!confirm('確定放棄本局，重新設定玩家？'))return;busy=false;close();phase='setup';players=[];placed=[];rewardSent=false;active=0;$('face').textContent='—';$('roll').disabled=true;updateTokens();setStatus('請選科目、單元、活動及 2～6 位玩家');setBlackboardIdle();setDeckText('機會','點此查看機會卡說明');setDeckText('命運','點此查看命運卡說明')}
function loadRoster(){if(!token||!window.opener)return;window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.opener||e.data?.token!==token)return;if(e.data.kind==='fundesk-monopoly-roster'){classes=(e.data.classes||[]).filter(c=>Array.isArray(c.students)).map(c=>({code:String(c.code),label:String(c.label),students:c.students.map(s=>({id:String(s.id),name:String(s.name),no:Number(s.no),avatar:String(s.avatar||'')}))}));setStatus('已連接 FunDesk '+classes.length+' 班，請選擇玩家')}else if(e.data.kind==='fundesk-monopoly-award-result'){alert(e.data.ok?'老師已確認將得獎點數寫入 FunDesk！':'尚未完成頒獎：'+(e.data.error||'教師未確認'));if(!e.data.ok)rewardSent=false}});window.opener.postMessage({kind:'fundesk-monopoly-ready',token},location.origin)}
// 使用既有 Supabase 公開讀取權限；沒有任何私密 service_role key。
async function cloudBank(){
 const url='https://ayvwsexnxvjjcrbtyoof.supabase.co',key='sb_publishable_Z2rS84mJC4BK-h4oLsNNjw_CdQz240L';
 let added=0,unclassified=0,invalid=0;const reports=[];
 const seen=new Set(bank.filter(q=>q.subject==='science').map(q=>q.unit+'|'+q.text.trim()));
 for(const table of ['quiz_questions','nature_questions']){
  let total=0,accepted=0;
  try{
   for(let offset=0;offset<5000;offset+=500){
    const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
    let res;try{res=await fetch(url+'/rest/v1/'+table+'?select=*&limit=500&offset='+offset,{headers:{apikey:key,Accept:'application/json'},signal:controller.signal,cache:'no-store'})}finally{clearTimeout(timeout)}
    if(!res.ok){reports.push(table+': HTTP '+res.status);break}
    const rows=await res.json();if(!Array.isArray(rows)){reports.push(table+': 格式不正確');break}total+=rows.length;
    for(let i=0;i<rows.length;i++){
     const q=normalize(rows[i],table+'-'+offset+'-'+i);if(!q){invalid++;continue}
     if(!q.activity){unclassified++;continue} // 未標記活動的題目不可擅自歸類為活動 1～3。
     const identity=q.unit+'|'+q.text.trim();if(seen.has(identity))continue;
     q.id=table+':'+q.id;seen.add(identity);bank.push(q);added++;accepted++;
    }
    if(rows.length<500)break;
   }
   reports.push(table+': 讀取 '+total+' 筆／新增 '+accepted+' 題');
  }catch(e){reports.push(table+': '+(e?.name==='AbortError'?'連線逾時':e?.message||'連線失敗'))}
 }
 const counts=Array.from({length:4},(_,i)=>{const u=String(i+1);return '第'+u+'單元 '+bank.filter(q=>q.subject==='science'&&q.unit===u&&q.activity).length+'題'});
 cloudReport='已載入：'+counts.join('、')+'。線上新增 '+added+' 題。'+reports.join('；')+(unclassified?'；有 '+unclassified+' 題缺活動標記，暫不列入12活動':'')+(invalid?'；有 '+invalid+' 筆資料缺題幹、選項或答案':'');
 const info=$('cloudStatus');if(info)info.textContent=cloudReport;
 if($('bankSubject')?.value==='science'){
  document.querySelectorAll('#bankChips .activity-toggle').forEach(input=>{const span=input.closest('label')?.querySelector('.activity-count');if(span)span.textContent=bank.filter(q=>q.subject==='science'&&keyOf(q)===input.value).length+' 題'});
  const info=$('cloudStatus');if(info)info.textContent=cloudReport;
 }

}
const raw=window.CAMPUS_QUESTIONS||[];
bank=raw.map(normalize).filter(Boolean);
for(const q of (Array.isArray(window.SOCIAL_QUESTIONS)?window.SOCIAL_QUESTIONS:[])){
 if(!q.question||!q.unit||!q.activity||typeof q.correct!=='boolean')continue;
 bank.push({subject:'social',id:'social:'+q.id,unit:String(q.unit),activity:String(q.activity),text:String(q.question),options:['○ 正確','× 錯誤'],answer:q.correct?0:1,explanation:String(q.explanation||'原題庫未提供詳解。')});
}
for(const q of (Array.isArray(window.FUNDESK_MATH_QUESTIONS)?window.FUNDESK_MATH_QUESTIONS:[])){
 const m=String(q.unit||'').match(/^10-0?([1-4])$/);
 if(!m||!q.question||!Array.isArray(q.options)||q.options.length!==4||
 !Number.isInteger(q.answer)||q.answer<0||q.answer>=4)continue;
 bank.push({subject:'math',id:String(q.id),unit:'10',activity:m[1],
  text:String(q.question),options:q.options.map(String),answer:q.answer,
  explanation:String(q.explanation||''),sourceId:String(q.sourceId||'')});
}

for(const q of (Array.isArray(window.FUNDESK_MATH9_QUESTIONS)?window.FUNDESK_MATH9_QUESTIONS:[])){
 const m=String(q.unit||'').match(/^9-0?([1-5])$/);
 if(!m||!q.question||!Array.isArray(q.options)||q.options.length!==4||!Number.isInteger(q.answer)||q.answer<0||q.answer>3)continue;
 bank.push({subject:'math',id:String(q.id),unit:'9',activity:m[1],text:String(q.question),
  options:q.options.map(String),answer:q.answer,explanation:String(q.explanation||''),sourceId:String(q.sourceId||'')});
}
picked=Array.from({length:12},(_,i)=>String(1+Math.floor(i/3))+'-'+String(1+i%3));cloudReport='第一、二、四單元內建題庫已載入；正在檢查雲端第三、四單元…';setBlackboardIdle();syncBankSummary();cloudBank();loadRoster();renderBoardPlayers();
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>({bank:presentBank,players:presentPlayers,stats:presentStats}[b.dataset.panel])());$('chanceDeckBtn').onclick=()=>showDeckIntro('機會');$('fateDeckBtn').onclick=()=>showDeckIntro('命運');$('setup').onclick=()=>phase==='setup'?presentPlayers():presentStats();$('begin').onclick=start;$('howto').onclick=presentRules;
